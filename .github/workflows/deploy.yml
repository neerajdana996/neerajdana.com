name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tailwind CLI and Pillow
        run: |
          npm install --no-audit --no-fund
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core
      - name: Build site (HTML, Tailwind CSS, sitemap, OG image)
        run: python3 build.py
      - name: Check the stylesheet was built
        run: test -s dist/styles.css && ls -la dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Bing and other search engines (IndexNow)
        continue-on-error: true
        run: |
          URLS=$(curl -fsS https://neerajdana.com/urls.txt | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"neerajdana.com\",\"key\":\"0d5aa270e45be7b2b3529240ac7bfdfa\",\"keyLocation\":\"https://neerajdana.com/0d5aa270e45be7b2b3529240ac7bfdfa.txt\",\"urlList\":$URLS}" -w "IndexNow HTTP %{http_code}\n"
